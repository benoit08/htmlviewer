# ===== 화면 =====
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
# 프런트 산출물(ecm-mask 폴더)을 복사하지 않고 그대로 씀 — sample 폴더에서 실행 기준 상대경로
ecm-mask.dir=../ecm-mask
# JSP 를 고치면 재기동 없이 반영 (샘플 개발용)
server.servlet.jsp.init-parameters.development=true

# 마스킹 저장 시 업로드 크기 (PDF 여러 장 PNG)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

# ===== DB (H2 파일 DB, Oracle 호환 모드) =====
spring.datasource.url=jdbc:h2:file:./data/h2/ecm;MODE=Oracle;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
# 조회용 콘솔: http://localhost:8080/h2-console  (JDBC URL 은 위와 같게)
spring.h2.console.enabled=true

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# ===== XVARM =====
# local  : 엔진 없이 xvarm.local-dir 폴더에 저장 (동작 흉내, 기본)
# inzent : 실제 엔진. 아래 접속값을 채움
xvarm.mode=local
xvarm.local-dir=./data/xvarm
# ※ 라이선스: XVARM jar 는 라이선스 대상 고객사 전용. 이 프로젝트(소스 · 빌드 · war)에 복사하거나 의존성으로 넣지 말 것.
#   테스트할 때만 실행 인자로 프로젝트 밖 경로를 지정한다.  예) --xvarm.jar-path=D:/라이선스/xtormapi_20210723.jar
#   비워 두면 앱 클래스패스에서 찾는다 (EDMS 처럼 고객사 서버에 jar 가 이미 배치된 경우)
xvarm.jar-path=
xvarm.ip=
xvarm.port=2102
xvarm.desc=ECM Mask
xvarm.user=
xvarm.password=
xvarm.gateway=XVARM_MAIN
# m_cClassId(컨텐츠 클래스) / m_eClassId(요소 클래스) / m_userSClass(보안 클래스) — 엔진에 등록된 값
xvarm.content-class=BASIC
xvarm.element-class=IMAGE
xvarm.security-class=PUBLIC

# 마스킹본 저장 후 원본 요소 삭제 여부 (false = 원본 보관, MASK_ORG_ELEMENT_ID 에 키 기록)
ecm-mask.delete-original=false
