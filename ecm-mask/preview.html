<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECM 문서 마스킹 — 개발용 미리보기</title>
<!-- JSP 없이 확인하는 용도. 반드시 http:// 로 열 것 (file:// 은 fetch/PDF.js worker 제한).
     예) 이 폴더에서 `python -m http.server 8000` → http://localhost:8000/preview.html
         ?confirm=1 을 붙이면 confirm 버전 -->
<link rel="stylesheet" href="ecmMask.css">
<link rel="stylesheet" href="ecmMask.skin.css">
<style>body{margin:0}</style>
</head>
<body>
<div id="host"></div>
<script src="lib/pdfjs/pdf.min.js"></script>
<script src="ecmMask.js"></script>
<script>
fetch('ecmMask.body.jspf').then(function(r){ return r.text(); }).then(function(h){
  h=h.replace(/^<%@.*\r?\n/,'');   // 첫 줄의 JSP 인코딩 지시문 제거
  document.getElementById('host').innerHTML=h;
  window.ecmMaskHandle=EcmMask.init(document.getElementById('ecmMask'),{
    api:{list:'',file:'',save:''},
    pdfWorker:'lib/pdfjs/pdf.worker.min.js',
    saveConfirm:/[?&]confirm=1/.test(location.search)?'confirm':'modal'
  });
});
</script>
</body>
</html>
